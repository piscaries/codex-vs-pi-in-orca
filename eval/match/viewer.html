<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Match Viewer</title>
<style>
  :root { --bg: #f6f4ef; --ink: #1d1d1f; --muted: #6b6b70; --light: #ece3cf; --dark: #8aa17f; --card: #fff; --line: #ddd8cc; --hl: #f3d66b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { display: flex; gap: 28px; padding: 28px; align-items: flex-start; }
  .board { display: grid; grid-template-columns: repeat(8, 64px); border: 2px solid #5b5248; border-radius: 4px; overflow: hidden; }
  .sq { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 46px; line-height: 1; position: relative; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.hl { box-shadow: inset 0 0 0 4px var(--hl); }
  .coord { position: absolute; left: 3px; bottom: 1px; font-size: 10px; color: #4a4a4a; }
  .w { color: #fff; -webkit-text-stroke: 1.4px #222; } .b { color: #111; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 300px; }
  h1 { font-size: 18px; margin: 0 0 4px; } .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; margin: 6px 0; } .big { font-size: 22px; font-weight: 600; }
  .players div { margin: 3px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div><div id="board" class="board" aria-label="board"></div></div>
  <div class="card">
    <h1 id="title">Engine match</h1>
    <div class="muted" id="sub"></div>
    <div class="players" id="players"></div>
    <div class="row"><span>Move</span><span id="ply"></span></div>
    <div class="row"><span>Last move</span><span id="last"></span></div>
    <div class="row"><span>Game result</span><span id="result"></span></div>
    <div class="muted" style="margin-top:10px">Positions replayed from the match log given in <code>?file=</code>. This viewer is the coordinator's tool, not either team's app.</div>
  </div>
</div>
<script>
const P = { K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙', k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
const q = new URLSearchParams(location.search);
const gi = Number(q.get('game') || 0), file = q.get('file') || 'match-200ms.json';
const names = { A: q.get('A') || 'Engine A', B: q.get('B') || 'Engine B' };
fetch(file).then(r => r.json()).then(d => {
  const g = d.games[gi];
  const fens = [g.startFen, ...g.fens];
  let k = q.get('ply') === 'end' ? fens.length - 1 : Math.min(Number(q.get('ply') || 0), fens.length - 1);
  const fen = fens[k], last = k > 0 ? g.moves[k - 1] : null;
  const rows = fen.split(' ')[0].split('/');
  const board = document.getElementById('board');
  rows.forEach((row, r) => { let f = 0; for (const ch of row) {
    if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) add(r, f++, ''); } else add(r, f++, ch); } });
  function add(r, f, ch) {
    const s = document.createElement('div'); const sq = 'abcdefgh'[f] + (8 - r);
    s.className = 'sq ' + ((r + f) % 2 ? 'd' : 'l') + (last && (last.slice(0,2) === sq || last.slice(2,4) === sq) ? ' hl' : '');
    if (ch) { const span = document.createElement('span'); span.textContent = P[ch] + '︎'; span.className = ch === ch.toUpperCase() ? 'w' : 'b'; s.appendChild(span); }
    if (f === 0) { const c = document.createElement('span'); c.className = 'coord'; c.textContent = 8 - r; s.appendChild(c); }
    board.appendChild(s);
  }
  document.getElementById('title').textContent = `Game ${gi + 1} of ${d.games.length}`;
  document.getElementById('sub').textContent = `Opening: ${g.opening} · ${d.timeMs} ms per move`;
  document.getElementById('players').innerHTML = `<div>White: <b>${names[g.white]}</b></div><div>Black: <b>${names[g.black]}</b></div>`;
  document.getElementById('ply').textContent = k === fens.length - 1 ? `${g.plies} (final position)` : `${k} of ${g.plies} plies after the opening`;
  document.getElementById('last').textContent = last || '—';
  document.getElementById('result').textContent = `${g.result} (${g.reason})`;
});
</script>
</body>
</html>
